<html>
<head>
    <title>Student ID Card</title>
    <link rel="stylesheet" href="style.css">
    <style>

    body{
    background:#ececec;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    }

    .card{
    width:340px;
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 0 20px rgba(0,0,0,.2);

    }

    h1{
    text-align:center;
    color:#5b00b5;
    margin:20px 0 10px;
    font-size:30px;
    }

    hr{
    width:80%;
    margin:auto;
    border:1px solid #5b00b5;
    }

   .photo{
    text-align:center;
    margin:25px 0;
    }

   .photo img{
    width:170px;
    height:170px;
    border-radius:50%;
    border:4px solid #6a00d4;
    object-fit:cover;
    }

   .Id{
    width:85%;
    margin:auto;
    }

   .Id p{
    padding:15px 0;
    border-bottom:1px solid #ddd;
    font-size:18px;
    color:#333;
    }

   .Id i{
    color:#5b00b5;
    font-size:22px;
    width:40px;
    }

    .Id b{
    color:#3d1668;
    margin-right:10px;
    }

   #but{
    margin-top:30px;
    background:#6a00d4;
    height:120px;
    border-top-left-radius:70% 40px;
    border-top-right-radius:70% 40px;
    display:flex;
    justify-content:center;
    align-items:center;
    }

   .bar{
    background:#fff;
    padding:12px 20px;
    border-radius:12px;
    text-align:center;
    }

   .bar span{
    display:block;
    font-family:Arial;
    font-size:18px;
    font-weight:bold;
    margin-top:8px;
   }
    </style>
</head>
<body>
<center>
<div class="card">

    <h1>STUDENT ID CARD</h1>
    <hr>

    <div class="photo">
        <img src="student.jpg" alt="Student">
    </div>

    <div class="Id">
        <p> <b>Name:</b> Gayatri Patil</p>
        <p> <b>Roll No:</b> 26</p>
        <p> <b>Batch Time:</b> 8:00 t0 10:00</p>
        <p> <b>Course:</b> Java Web Development</p>
        <p> <b>College:</b> R. C. Patel College Of Enggineering and Polytechnic,shirpur.</p>
    </div>

    <div id="but">
        <div class="bar">
            |||||||||||||||||||||||||||||||||
            <br>
            <span>Valid Student ID</span>
        </div>
    </div>
</div>
</center>
</body>
</html>
